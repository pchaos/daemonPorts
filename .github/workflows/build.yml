name: Build Gatekeeper (Multi-Platform)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:          # 手动触发

permissions:
  contents: write

# ── 环境 ────────────────────────────────────────────────────────────
env:
  XMAKE_GLOBALDIR: ${{ github.workspace }}/.xmake-global
  XMAKE_ROOT: y               # 容器内允许 root 运行 xmake

jobs:
  # ═══════════════════════════════════════════════════════════════════
  # Linux (x86_64) ── native
  # ═══════════════════════════════════════════════════════════════════
  linux-amd64:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Configure & Build (release)
        run: |
          xmake f -p linux -a x86_64 -m release -y
          xmake

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gatekeeper-linux-amd64
          path: build/linux/x86_64/*

  # ═══════════════════════════════════════════════════════════════════
  # Linux (arm64) ── 交叉编译（aarch64-linux-gnu-gcc）
  # ═══════════════════════════════════════════════════════════════════
  linux-arm64:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Install cross toolchain & xmake
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
        shell: bash

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Configure & Build (release, arm64)
        run: |
          xmake f -p linux -a arm64 -m release \
            --cross=aarch64-linux-gnu- \
            -y
          xmake

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gatekeeper-linux-arm64
          path: build/linux/arm64/*

  # ═══════════════════════════════════════════════════════════════════
  # Linux (i386) ── 交叉编译
  # ═══════════════════════════════════════════════════════════════════
  linux-i386:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Install cross toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-i686-linux-gnu g++-i686-linux-gnu
        shell: bash

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Configure & Build (release, i386)
        run: |
          xmake f -p linux -a i386 -m release \
            --cross=i686-linux-gnu- \
            -y
          xmake

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gatekeeper-linux-i386
          path: build/linux/i386/*

  # ═══════════════════════════════════════════════════════════════════
  # Windows (MinGW) ── Linux 宿主交叉编译
  # ═══════════════════════════════════════════════════════════════════
  windows-mingw:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, i686]
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW cross toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-mingw-w64
        shell: bash

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Configure & Build (release, MinGW)
        run: |
          xmake g --mingw=/usr
          xmake f -p mingw -a ${{ matrix.arch }} -m release -y
          xmake

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gatekeeper-windows-mingw-${{ matrix.arch }}
          path: build/mingw/${{ matrix.arch }}/*

  # ═══════════════════════════════════════════════════════════════════
  # Windows (MSVC) ── 原生 Windows 构建
  # ═══════════════════════════════════════════════════════════════════
  windows-msvc:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@v4

      - name: Install xmake
        shell: pwsh
        run: |
          # Download xmake installer
          $tmp = "$env:TEMP\xmake-installer.exe"
          Invoke-Webrequest "https://github.com/xmake-io/xmake/releases/download/v3.0.9/xmake-v3.0.9.win64.exe" -OutFile $tmp -UseBasicParsing
          # Install silently
          $installDir = "$env:USERPROFILE\.xmake"
          Start-Process -FilePath $tmp -ArgumentList "/S /D=$installDir" -Wait
          Remove-Item $tmp -ErrorAction SilentlyContinue
          # Add to PATH
          "$installDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "XMAKE_DIR=$installDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure & Build (release)
        shell: pwsh
        run: |
          xmake f -p windows -a ${{ matrix.arch }} -m release -y
          xmake

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gatekeeper-windows-msvc-${{ matrix.arch }}
          path: build/windows/${{ matrix.arch }}/*

  # ═══════════════════════════════════════════════════════════════════
  # macOS (arm64) ── Apple Silicon
  # ═══════════════════════════════════════════════════════════════════
  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Install xmake
        run: |
          curl -fsSL https://xmake.io/shget.text | bash
          echo "XMAKE_DIR=$HOME/.xmake" >> $GITHUB_ENV
          echo "$HOME/.xmake/bin" >> $GITHUB_PATH

      - name: Configure & Build (release)
        run: |
          xmake f -p macosx -a ${{ matrix.arch }} -m release -y
          xmake

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gatekeeper-macosx-${{ matrix.arch }}
          path: build/macosx/${{ matrix.arch }}/*

  # ═══════════════════════════════════════════════════════════════════
  # Android (arm64-v8a) ── NDK 交叉编译
  # ═══════════════════════════════════════════════════════════════════
  android-arm64:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Locate Android NDK
        run: |
          NDK=$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$NDK" ]; then
            echo "::error::No Android NDK found under /usr/local/lib/android/sdk/ndk/"
            exit 1
          fi
          echo "Found NDK: $NDK"
          echo "ANDROID_NDK_HOME=$NDK" >> $GITHUB_ENV

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Configure & Build (release, android arm64-v8a)
        run: |
          xmake f -p android -a arm64-v8a -m release --ndk="$ANDROID_NDK_HOME" -y
          xmake

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gatekeeper-android-arm64
          path: build/android/arm64-v8a/*

  # ═══════════════════════════════════════════════════════════════════
  # Debug 测试 (Linux amd64)
  # ═══════════════════════════════════════════════════════════════════
  test:
    runs-on: ubuntu-latest
    needs: [linux-amd64]
    steps:
      - uses: actions/checkout@v4

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Configure & Build (debug) — runs tests automatically
        run: |
          xmake f -p linux -a x86_64 -m debug -y
          xmake
        # after_build 中的 test-gatekeeper 会在 debug 模式下自动执行

      - name: Verify gatekeeper binary exists
        run: |
          ls -lh build/linux/x86_64/

  # ═══════════════════════════════════════════════════════════════════
  # 自动发版：main 有新版本号时创建 tag + Release
  # ═══════════════════════════════════════════════════════════════════
  create-release:
    if: github.event_name == 'push' || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: [linux-amd64, linux-arm64, linux-i386, windows-mingw, windows-msvc, macos, android-arm64, test]
    outputs:
      version: v${{ steps.version.outputs.version }}
      skip: ${{ steps.check.outputs.skip }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 读取版本号
        id: version
        run: |
          VERSION=$(grep -oP 'GATEKEEPER_VERSION\s*=\s*"\K[^"]+' xmake.lua)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: 检查 release 是否存在
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          # 仅 main push 时自动发版；release/dispatch 事件只读检查
          if [ "${{ github.event_name }}" != "push" ] || [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "非 main push，不自动发版"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            ASSETS=$(gh release view "${TAG}" --json assets -q '.assets | length')
            if [ "${ASSETS}" -eq 0 ]; then
              echo "Release ${TAG} 存在但无产物，删除重建"
              gh release delete "${TAG}" --yes --cleanup-tag
              echo "skip=false" >> "$GITHUB_OUTPUT"
            else
              echo "Release ${TAG} 已存在且有产物，跳过"
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 创建 tag + Release
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          gh release create "${TAG}" \
            --target "${{ github.sha }}" \
            --title "${TAG}" \
            --generate-notes
          echo "已创建 Release ${TAG}"

  # ═══════════════════════════════════════════════════════════════════
  # 发布：依赖 create-release 先建后传，收集所有产物附加到 release
  # ═══════════════════════════════════════════════════════════════════
  publish:
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.create-release.outputs.skip == 'false')
    needs:
      - create-release
      - linux-amd64
      - linux-arm64
      - linux-i386
      - windows-mingw
      - windows-msvc
      - macos
      - android-arm64
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten & rename artifacts for release
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            platform=$(basename "$dir")
            find "$dir" -type f | while read f; do
              fname=$(basename "$f")
              mv "$f" "release/${platform}-${fname}"
            done
          done
          echo "=== Release assets ==="
          ls -lh release/

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub 表达式 &&/|| 返回布尔值，不能用三元拼接；按事件分支取 tag
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ needs.create-release.outputs.version }}"
          fi
          echo "上传产物到 ${TAG}"
          gh release upload "${TAG}" release/* --clobber
