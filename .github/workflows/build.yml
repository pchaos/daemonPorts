name: Build Gatekeeper (Multi-Platform)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:          # 手动触发

# ── 环境 ────────────────────────────────────────────────────────────
env:
  XMAKE_GLOBALDIR: ${{ github.workspace }}/.xmake-global
  XMAKE_ROOT: y               # 容器内允许 root 运行 xmake

jobs:
  # ═══════════════════════════════════════════════════════════════════
  # Linux (x86_64) ── native
  # ═══════════════════════════════════════════════════════════════════
  linux-amd64:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Configure & Build (release)
        run: |
          xmake f -p linux -a x86_64 -m release -y
          xmake

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gatekeeper-linux-amd64
          path: build/linux/x86_64/*

  # ═══════════════════════════════════════════════════════════════════
  # Linux (arm64) ── 交叉编译（aarch64-linux-gnu-gcc）
  # ═══════════════════════════════════════════════════════════════════
  linux-arm64:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Install cross toolchain & xmake
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
        shell: bash

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Configure & Build (release, arm64)
        run: |
          xmake f -p linux -a arm64 -m release \
            --cross=aarch64-linux-gnu- \
            -y
          xmake

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gatekeeper-linux-arm64
          path: build/linux/arm64/*

  # ═══════════════════════════════════════════════════════════════════
  # Linux (i386) ── 交叉编译
  # ═══════════════════════════════════════════════════════════════════
  linux-i386:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Install cross toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-i686-linux-gnu g++-i686-linux-gnu
        shell: bash

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Configure & Build (release, i386)
        run: |
          xmake f -p linux -a i386 -m release \
            --cross=i686-linux-gnu- \
            -y
          xmake

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gatekeeper-linux-i386
          path: build/linux/i386/*

  # ═══════════════════════════════════════════════════════════════════
  # Windows (MinGW) ── Linux 宿主交叉编译
  # ═══════════════════════════════════════════════════════════════════
  windows-mingw:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, i686]
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW cross toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-mingw-w64
        shell: bash

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Configure & Build (release, MinGW)
        run: |
          xmake g --mingw=/usr
          xmake f -p mingw -a ${{ matrix.arch }} -m release -y
          xmake

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gatekeeper-windows-mingw-${{ matrix.arch }}
          path: build/mingw/${{ matrix.arch }}/*

  # ═══════════════════════════════════════════════════════════════════
  # Windows (MSVC) ── 原生 Windows 构建
  # ═══════════════════════════════════════════════════════════════════
  windows-msvc:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@v4

      - name: Install xmake
        shell: pwsh
        run: |
          # Download xmake installer
          $tmp = "$env:TEMP\xmake-installer.exe"
          Invoke-Webrequest "https://github.com/xmake-io/xmake/releases/download/v3.0.9/xmake-v3.0.9.win64.exe" -OutFile $tmp -UseBasicParsing
          # Install silently
          $installDir = "$env:USERPROFILE\.xmake"
          Start-Process -FilePath $tmp -ArgumentList "/S /D=$installDir" -Wait
          Remove-Item $tmp -ErrorAction SilentlyContinue
          # Add to PATH
          "$installDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "XMAKE_DIR=$installDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure & Build (release)
        shell: pwsh
        run: |
          xmake f -p windows -a ${{ matrix.arch }} -m release -y
          xmake

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gatekeeper-windows-msvc-${{ matrix.arch }}
          path: build/windows/${{ matrix.arch }}/*

  # ═══════════════════════════════════════════════════════════════════
  # macOS (arm64) ── Apple Silicon
  # ═══════════════════════════════════════════════════════════════════
  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Install xmake
        run: |
          curl -fsSL https://xmake.io/shget.text | bash
          echo "XMAKE_DIR=$HOME/.xmake" >> $GITHUB_ENV
          echo "$HOME/.xmake/bin" >> $GITHUB_PATH

      - name: Configure & Build (release)
        run: |
          xmake f -p macosx -a ${{ matrix.arch }} -m release -y
          xmake

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gatekeeper-macosx-${{ matrix.arch }}
          path: build/macosx/${{ matrix.arch }}/*

  # ═══════════════════════════════════════════════════════════════════
  # Debug 测试 (Linux amd64)
  # ═══════════════════════════════════════════════════════════════════
  test:
    runs-on: ubuntu-latest
    needs: [linux-amd64]
    steps:
      - uses: actions/checkout@v4

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Configure & Build (debug) — runs tests automatically
        run: |
          xmake f -p linux -a x86_64 -m debug -y
          xmake
        # after_build 中的 test-gatekeeper 会在 debug 模式下自动执行

      - name: Verify gatekeeper binary exists
        run: |
          ls -lh build/linux/x86_64/

  # ═══════════════════════════════════════════════════════════════════
  # 发布：收集所有产物到一个 release
  # ═══════════════════════════════════════════════════════════════════
  publish:
    if: github.event_name == 'release'
    needs:
      - linux-amd64
      - linux-arm64
      - linux-i386
      - windows-mingw
      - windows-msvc
      - macos
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload to release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
